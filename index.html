<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素記号</title>
    <style>
        :root {
            --main-green: #e8f5e9;
            --dark-green: #2e7d32;
            --main-blue: #e3f2fd;
            --dark-blue: #1565c0;
            --accent-yellow: #fff9c4;
            --text-color: #333;
        }

        body {
            font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
            background-color: #f1f8e9;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 4px solid var(--dark-green);
            text-align: center;
        }

        h1 {
            color: var(--dark-blue);
            font-size: 1.4rem;
            margin: 0 0 10px 0;
        }

        .desc {
            font-size: 0.9rem;
            background: var(--main-blue);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            line-height: 1.4;
            font-weight: bold;
        }

        #quiz-area {
            background: var(--main-green);
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        #quiz-area:active {
            transform: scale(0.98);
        }

        .animal-icon {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 2rem;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .answer-box {
            background: white;
            color: #d32f2f;
            padding: 10px;
            border-radius: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            border: 2px solid #d32f2f;
            display: none;
        }

        .btn-next {
            background: var(--dark-blue);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px #0d47a1;
            width: 100%;
            font-weight: bold;
        }

        .btn-next:active {
            box-shadow: none;
            transform: translateY(4px);
        }

        .counter {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>元素記号チェック</h1>
    <div class="desc">次の原子の記号を答えよ</div>

    <div id="quiz-area" onclick="revealAnswer()">
        <div id="animal" class="animal-icon">🐶</div>
        <div id="q-text" class="question-text">問題読み込み中...</div>
        <div id="a-text" class="answer-box"></div>
    </div>

    <button class="btn-next" onclick="nextQuestion()">次へ ➔</button>
    <div id="count" class="counter"></div>
</div>

<script>
    // CSVから抽出した全問題データ
    const masterData = [
        {q: "水素", a: "H"},
        {q: "塩素", a: "Cl"},
        {q: "炭素", a: "C"},
        {q: "窒素", a: "N"},
        {q: "酸素", a: "O"},
        {q: "カルシウム", a: "Ca"},
        {q: "鉄", a: "Fe"},
        {q: "ナトリウム", a: "Na"},
        {q: "マグネシウム", a: "Mg"},
        {q: "金", a: "Au"},
        {q: "銀", a: "Ag"},
        {q: "亜鉛", a: "Zn"}
    ];

    let quizList = [];
    let currentIndex = 0;
    const animals = ["🐶", "🐱", "🐰", "🦊", "🐻", "🐼", "🐨", "🦁", "🐧"];

    function shuffle() {
        quizList = [...masterData].sort(() => Math.random() - 0.5);
        currentIndex = 0;
    }

    function showQuiz() {
        const q = quizList[currentIndex];
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('a-text').innerText = "答え： " + q.a;
        document.getElementById('a-text').style.display = 'none';
        document.getElementById('animal').innerText = animals[Math.floor(Math.random() * animals.length)];
        document.getElementById('count').innerText = `問題 ${currentIndex + 1} / ${quizList.length}`;
    }

    function revealAnswer() {
        document.getElementById('a-text').style.display = 'block';
    }

    function nextQuestion() {
        if (document.getElementById('a-text').style.display === 'none') {
            revealAnswer();
            return;
        }
        
        currentIndex++;
        if (currentIndex < quizList.length) {
            showQuiz();
        } else {
            alert("お疲れ様でした！全問終了です。最初から解き直しましょう！");
            shuffle();
            showQuiz();
        }
    }

    // 初期化
    shuffle();
    showQuiz();
</script>

</body>
</html>
